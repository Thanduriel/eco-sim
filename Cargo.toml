[package]
name = "eco-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["jpeg", "bevy_dev_tools", "render_dev_tools", "trace"] }
noise = { version = "0.9.0" }
rand = "0.10"
bevy_rand = "0.16"
bevy_prng = { version = "0.16", features = ["wyrand"] }
num-traits = "0.2"
bevy_egui = "0.43"
egui-probe = {version = "0.13", features = ["derive"] }
cubecl = {version = "0.11", features = ["cuda"] }
glam = { version = "0.33", features = ["usize"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
