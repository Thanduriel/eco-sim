[package]
name = "eco-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["jpeg", "bevy_dev_tools", "trace"] }
noise = { version = "0.9.0" }
rand = "0.10"
bevy_rand = "0.15"
bevy_prng = { version = "0.15", features = ["wyrand"] }
num-traits = "0.2"
bevy_egui = "0.41"
egui-probe = {version = "0.12", features = ["derive"] }
cubecl = {version = "0.10", features = ["cuda"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
